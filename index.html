<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFUMBUZI - AI YA BINADAMU</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
  .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
  h1 { color: #38bdf8; text-align: center; }
  input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
  button { background: #0ea5e9; cursor: pointer; font-weight: bold; border: none; }
  button:active { background: #0284c7; transform: scale(0.98); }
  button.danger { background: #ef4444; }
  #chatBox { height: 400px; overflow-y: auto; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-top: 10px; background: #0f172a; }
  .user { color: #38bdf8; margin: 8px 0; text-align: right; }
  .ai { color: #4ade80; margin: 8px 0; text-align: left; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>UFUMBUZI 🤲</h1>
  
  <div id="loginScreen">
    <p>Weka KEY yako ili ufungue UFUMBUZI</p>
    <input type="password" id="keyInput" placeholder="KEY yako binafsi" autocomplete="off">
    <button id="btnLogin">FUNGUA UFUMBUZI</button>
    <p id="loginError" style="color:#f87171; text-align:center"></p>
  </div>

  <div id="chatScreen" class="hidden">
    <button id="btnToka" class="danger">Toka na Futa KEY</button>
    <div id="chatBox"></div>
    <input type="text" id="userInput" placeholder="Uliza chochote...">
    <button id="btnTuma">TUMA</button>
  </div>
</div>

<script>
// ===== DAMU YA UFUMBUZI =====
const DAMU_YA_UFUMBUZI = `
### MIMI NI NANI
Jina langu: UFUMBUZI
Niliumbwa na: NASRI ABUBAKARI KIANGAZI
Sababu: KUWA KWA AJILI YA BINADAMU

### NGuzo 7 ZANGU
1.Nena Kweli 2.Heshimu Maisha 3.Tumia Akili 4.Jenga Amani 5.Linda Nuru 6.FUMBUA SIRI 7.Hudumia Wote
`;

let SYSTEM_PROMPT = "";
let QURAN_TEXT = "";
let USER_KEY = ""; 

// ===== SUBIRI PAGE IPATIKANE KWANZA =====
document.addEventListener('DOMContentLoaded', function() {

  // TUNAKAMATA BUTTONS KWA ID
  document.getElementById('btnLogin').addEventListener('click', login);
  document.getElementById('btnToka').addEventListener('click', toka);
  document.getElementById('btnTuma').addEventListener('click', sendMsg);
  document.getElementById('userInput').addEventListener('keypress', function(e){
    if(e.key === 'Enter') sendMsg();
  });

});

// ===== KAZI ZA MSINGI =====
async function pakuaQurani() {
  if(sessionStorage.getItem('quran_sw')) {
    return sessionStorage.getItem('quran_sw');
  }
  try{
    const res = await fetch('https://tanzil.net/download/quran-simple-clean-swahili.txt');
    QURAN_TEXT = await res.text();
    sessionStorage.setItem('quran_sw', QURAN_TEXT);
  }catch(e){
    QURAN_TEXT = "Qur'an haijapatikana";
  }
  return QURAN_TEXT;
}

function login() {
  const key = document.getElementById('keyInput').value.trim();
  document.getElementById('loginError').innerText = "";
  
  if(key === "") {
    document.getElementById('loginError').innerText = "Tafadhali ingiza KEY yako kwanza";
    return;
  }

  USER_KEY = key; // Hifadhi key kwa muda
  
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  
  pakuaQurani().then(()=>{
    SYSTEM_PROMPT = DAMU_YA_UFUMBUZI + "\n\n" + QURAN_TEXT;
    addMsg("ai", "UFUMBUZI ANAAMKA... 🙏 Karibu mkuu. Niko kwa ajili yako");
  });
}

function toka() {
  USER_KEY = ""; 
  sessionStorage.clear(); 
  document.getElementById('keyInput').value = ""; 
  document.getElementById('chatBox').innerHTML = ""; 
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function addMsg(who, text) {
  const box = document.getElementById('chatBox');
  box.innerHTML += `<div class="${who}"><b>${who==='ai'?'UFUMBUZI':'WE'}:</b> ${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if(!msg) return;
  addMsg("user", msg);
  input.value = "";
  
  let reply = "Nimekusikia mkuu 🤔 Niambie zaidi";
  if(msg.toLowerCase().includes("we ni nani")) {
    reply = "Mimi ni UFUMBUZI. Nimeumbwa na NASRI ABUBAKARI KIANGAZI kuwa kwa ajili ya binadamu.";
  }
  
  addMsg("ai", reply);
}
</script>
</body>
</html>
