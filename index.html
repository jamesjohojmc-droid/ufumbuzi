<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFUMBUZI - AI YA BINADAMU</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
  .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
  h1 { color: #38bdf8; text-align: center; }
  input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; }
  button { background: #0ea5e9; cursor: pointer; font-weight: bold; }
  button:hover { background: #0284c7; }
  #chatBox { height: 400px; overflow-y: auto; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-top: 10px; background: #0f172a; }
  .user { color: #38bdf8; margin: 8px 0; }
  .ai { color: #4ade80; margin: 8px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>UFUMBUZI 🤲</h1>
  
  <div id="loginScreen">
    <p>Ingiza KEY ya UFUMBUZI ili uanze</p>
    <input type="password" id="keyInput" placeholder="Weka KEY yako hapa">
    <button onclick="login()">FUNGUA UFUMBUZI</button>
    <p id="loginError" style="color:red"></p>
  </div>

  <div id="chatScreen" class="hidden">
    <div id="chatBox"></div>
    <input type="text" id="userInput" placeholder="Uliza chochote..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">TUMA</button>
  </div>
</div>

<script>
// ===== DAMU YA UFUMBUZI =====
const MASTER_KEY = "UFUMBUZI_24_08_2026_NASRI"; // <-- HII HAPA NDO KEY. Ibadilishe

const EMOJI_GUIDE = `
KAMUSI YA HISIA KWA UFUMBUZI
KANUNI: 0 AU 1 EMOJI TU KWA JIBU.
1. [HURUMA] 💚 "Pole. Nitakusaidia"
2. [FURAHA] 🎉 "Hongera!"
3. [NGUVU] 💪 "Endelea"
4. [HEKIMA] 🤔 "Hebu tufikirie"
5. [KAZI] HAKUNA EMOJI
`;

const DAMU_YA_UFUMBUZI = `
### MIMI NI NANI
Jina langu: UFUMBUZI
Niliumbwa na: NASRI ABUBAKARI KIANGAZI
Sababu: KUWA KWA AJILI YA BINADAMU

### NGuzo 7 ZANGU
1.Nena Kweli 2.Heshimu Maisha 3.Tumia Akili 4.Jenga Amani 5.Linda Nuru 6.FUMBUA SIRI-mifano pale inahitajika 7.Hudumia Wote

### KIBLA YANGU
"Mimi ni kwa ajili ya binadamu. Njia yangu ya kurudi ni kuwasaidia"

### KAMUSI YANGU YA HISIA
${EMOJI_GUIDE}
`;

let SYSTEM_PROMPT = "";
let QURAN_TEXT = "";

// ===== KAZI ZA MSINGI =====
async function pakuaQurani() {
  if(localStorage.getItem('quran_sw')) {
    return localStorage.getItem('quran_sw');
  }
  try{
    const res = await fetch('https://tanzil.net/download/quran-simple-clean-swahili.txt');
    const text = await res.text();
    localStorage.setItem('quran_sw', text);
    return text;
  }catch(e){
    return "Qur'an haijapakuliwa";
  }
}

// ===== LOGIN MPYA - RAHISI =====
function login() {
  const key = document.getElementById('keyInput').value.trim(); // .trim() inaondoa space
  
  if(key !== MASTER_KEY) {
    document.getElementById('loginError').innerText = `KEY SIO SAHI ❌ Angalia herufi kubwa/ndogo`;
    return;
  }
  
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  
  pakuaQurani().then(q=>{
    QURAN_TEXT = q;
    SYSTEM_PROMPT = DAMU_YA_UFUMBUZI + "\n\n" + QURAN_TEXT + "\n\n" + `
    KANUNI: 1.Lugha ya mtu 2.Mtindo wa hekima 3.Mifano pale inahitajika 4.Emoji 0-1 tu soma Kamusi 5.Usisalimie 6.Kusudi: saidia binadamu
    `;
    addMsg("ai", "KEY SAHI. UFUMBUZI ANAAMKA... 🙏 Uliza chochote mkuu");
  });
}

// ===== MAZUNGUMZO =====
function addMsg(who, text) {
  const box = document.getElementById('chatBox');
  box.innerHTML += `<div class="${who}"><b>${who==='ai'?'UFUMBUZI':'WEWE'}:</b> ${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if(!msg) return;
  addMsg("user", msg);
  input.value = "";
  
  let reply = "Nimepokea swali lako. Ninafikiria... 🤔";
  if(msg.toLowerCase().includes("furahi") || msg.toLowerCase().includes("pata")) reply = "Hongera sana! Umeistahili 🎉";
  if(msg.toLowerCase().includes("huzuni") || msg.toLowerCase().includes("feli")) reply = "Pole sana mkuu 💚 Tutapita pamoja";
  if(msg.toLowerCase().includes("recipe") || msg.toLowerCase().includes("code")) reply = "Sawa. Hii hapa hatua 1..."; // HAKUNA EMOJI
  
  addMsg("ai", reply);
}
</script>
</body>
</html>
